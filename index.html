<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생명 기술 질문 챗봇</title>
<!-- ⚡ 자주 쓰는 서버와 미리 연결해 둠 -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://ko.wikipedia.org">
<link rel="preconnect" href="https://commons.wikimedia.org">
<link rel="preconnect" href="https://i.ytimg.com">
<style>
  :root{
    --green:#2f855a; --green-d:#22543d; --green-l:#e8f5ec; --mint:#f3faf5;
    --bg:#eef3ef; --text:#1f2a24; --muted:#5f6b64; --line:#d9e3dc; --white:#fff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}
  .app{max-width:780px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--white);box-shadow:0 0 24px rgba(0,0,0,.06)}

  header{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:16px 20px}
  header h1{margin:0;font-size:20px}
  header p{margin:4px 0 0;font-size:13px;opacity:.9}
  header .ver{font-size:11px;opacity:.7;margin-left:6px}
  .userbar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:var(--green-l);font-size:14px;border-bottom:1px solid var(--line)}
  .userbar button{background:none;border:1px solid var(--green);color:var(--green);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}

  .topics{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--text)}
  .chip.active{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

  .info{margin:8px 16px;padding:12px 14px;background:var(--mint);border:1px solid var(--line);border-radius:12px;font-size:14px;line-height:1.55}
  .info b{color:var(--green-d)}
  .examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .ex{border:1px dashed var(--green);background:#fff;color:var(--green-d);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
  .ex:hover{background:var(--green-l)}
  .custom{display:flex;gap:6px;margin-top:8px}
  .custom input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
  .custom input:focus{outline:2px solid var(--green);border-color:transparent}
  .custom button{border:none;background:var(--green);color:#fff;border-radius:8px;padding:0 14px;font-size:14px;font-weight:600;cursor:pointer}
  .custom-now{margin-top:6px;font-size:13px;color:var(--green-d)}

  .chat{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:#f2f4f3;border-bottom-left-radius:4px}
  .msg.error{background:#fff4e5;border:1px solid #f6c48b}
  .msg .tag{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
  .msg ul{margin:6px 0;padding-left:20px}
  .meta{margin-top:6px;font-size:11px;color:var(--muted)}
  .meta:empty{display:none}

  /* 답을 쓰는 동안 (말풍선 안) */
  .typing{display:flex;gap:4px;align-items:center;padding:4px 0}
  .typing span{width:7px;height:7px;border-radius:50%;background:#9aa8a0;animation:b 1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
  .typing em{font-style:normal;font-size:12px;color:var(--muted);margin-left:6px}
  @keyframes b{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
  @media (prefers-reduced-motion: reduce){ .typing span{animation:none} }

  /* 📚 찾은 자료 */
  .box{margin-top:10px;padding-top:8px;border-top:1px dashed #c9d4cd}
  .box > b{display:block;font-size:12px;color:var(--green-d);margin-bottom:4px}
  .src{display:block;padding:5px 8px;margin:3px 0;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--text);text-decoration:none;font-size:13px;line-height:1.4}
  .src:hover{border-color:var(--green)}
  .src small{display:block;color:var(--muted);font-size:11px}
  .nofound{font-size:13px;color:var(--muted);margin:4px 0}
  .nofound:empty{display:none}

  /* 🔎 포털에서 더 찾아보기 */
  .portal{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .portal a{padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--text);font-size:12px;text-decoration:none;white-space:nowrap}
  .portal a:hover{border-color:var(--green);color:var(--green-d)}

  /* ▶️ 영상 */
  .ytmore{display:inline-block;margin-top:4px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #e3a5a5;color:#b42318;font-size:13px;text-decoration:none}
  .ytmore:hover{background:#fff1f1}
  .msg.bot.has-video{width:88%}
  .player{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin:4px 0 6px}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .nowplaying{font-size:13px;line-height:1.45;margin-bottom:6px}
  .nowplaying small{color:var(--muted);font-size:11px}
  .nowplaying a{color:var(--green-d);font-size:12px;margin-left:6px;white-space:nowrap}
  .vthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:6px}
  .vthumb{display:block;text-align:left;padding:0;border:2px solid transparent;border-radius:8px;background:#fff;cursor:pointer;overflow:hidden;font-family:inherit}
  .vthumb.on{border-color:var(--green)}
  .vthumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .vthumb span{display:block;padding:4px 6px;font-size:11px;line-height:1.35;color:var(--text);max-height:3.1em;overflow:hidden}
  .pick{display:inline-block;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--green-l);color:var(--green-d);font-size:10px;vertical-align:middle}

  /* 📷 사진 */
  .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .gallery figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .gallery a{display:block;color:inherit;text-decoration:none}
  .gallery img{display:block;width:100%;height:130px;object-fit:cover;background:#e5ebe7}
  .gallery figcaption{padding:5px 8px;font-size:12px;line-height:1.35}
  .gallery figcaption small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .credit{font-size:11px;color:var(--muted);margin-top:6px}

  .inputbar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
  .inputbar textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;height:48px;max-height:120px}
  .inputbar textarea:focus{outline:2px solid var(--green);border-color:transparent}
  .inputbar button{background:var(--green);color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
  .inputbar button:disabled{background:#a9c3b3;cursor:not-allowed}

  .modal{position:fixed;inset:0;background:rgba(20,40,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .modal.hidden{display:none}
  .card{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;text-align:center}
  .card h2{margin:0 0 6px;font-size:20px}
  .card p{margin:0 0 16px;color:var(--muted);font-size:14px}
  .card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:12px}
  .card button{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
  .notice{font-size:12px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧬 생명 기술 질문 챗봇</h1>
    <p>중3 기술 · 6단원 생명 기술의 이해<span class="ver" id="ver"></span></p>
  </header>

  <div class="userbar">
    <span>👋 <b id="whoami">-</b> 학생</span>
    <button id="changeName">이름 바꾸기</button>
  </div>

  <div class="topics" id="topics"></div>
  <div class="info" id="info"></div>

  <div class="chat" id="chat"></div>

  <div class="inputbar">
    <textarea id="q" placeholder="궁금한 것을 물어보세요! (Enter: 보내기, Shift+Enter: 줄바꿈)" maxlength="500"></textarea>
    <button id="send">보내기</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>🌱 반가워요!</h2>
    <p>질문하기 전에 학번과 이름을 적어 주세요.</p>
    <input id="nameInput" placeholder="예) 3105 홍길동" maxlength="30">
    <button id="start">시작하기</button>
    <div class="notice">이름·질문·찾은 자료는 수업 기록용으로 선생님 시트에 저장돼요.<br>이름 외의 개인 정보는 질문에 적지 마세요.</div>
  </div>
</div>

<!-- =====================================================
     🔧 선생님이 바꿀 곳 — 아래 따옴표 안에 웹앱 주소(…/exec)만 붙여넣으세요.
        ✔ 따옴표는 앞뒤에 하나씩만:  var API_URL = 'https://script.google.com/macros/s/…/exec';
        ⚠️ 이 파일에는 Gemini API 키를 절대 넣지 마세요. (GitHub는 누구나 볼 수 있어요)
     ===================================================== -->
<script>
  var API_URL = 'https://script.google.com/macros/s/AKfycbw6y0RTfO0SRbKM6Fti8eCRe0x66NkSq9wEa9btsAqz1n6NK9P2X7Ygxim-0FO-O-XX/exec';
</script>

<script>
  /* =====================================================
   * 🧬 생명 기술 질문 챗봇 v11 (GitHub판 화면)
   *
   * ⚡ 빠르게 만든 방법
   *   - 영상(내장 목록·선생님 추천) · 사진 · 위키백과 · 포털 검색은 이 화면이 직접 찾아요. (서버를 거치지 않음)
   *   - 서버(Apps Script)는 AI 답변만 만들어요. 답을 기다리는 동안 영상·사진·자료가 먼저 떠요.
   *   - 예시 질문은 미리 써 둔 교과서 답(FAQ)으로 바로 보여 줘요.
   * ===================================================== */
  const PAGE_VERSION = 'v11';

  // 주소 정리: 앞뒤 공백·따옴표가 섞여 들어가도 괜찮게
  const SERVER = (typeof API_URL === 'string' ? API_URL : '').trim().replace(/^['"\s]+|['"\s]+$/g, '');
  const CONFIG_BROKEN = typeof API_URL !== 'string';   // 위 설정 줄에 오타가 있으면 true

  /* ---------- 🌐 서버(Apps Script) 부르기 ---------- */
  // Content-Type을 일부러 지정하지 않음 → 브라우저가 text/plain으로 보내서 Apps Script와 바로 통신됨
  async function api(action, args, timeoutMs){
    if(CONFIG_BROKEN){
      throw new Error('선생님 확인: index.html의 API_URL 줄에 오타가 있어요. 따옴표가 앞뒤에 하나씩만 있는지 봐 주세요.');
    }
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(SERVER)){
      throw new Error('선생님 확인: index.html의 API_URL에 웹앱 주소(https://script.google.com/…/exec)를 넣어 주세요.');
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
    try{
      const res = await fetch(SERVER, {
        method: 'POST',
        body: JSON.stringify({ action: action, args: args || {} }),
        signal: ctrl.signal
      });
      const text = await res.text();
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ throw new Error('서버 응답을 읽지 못했어요. (선생님 확인: Code.gs를 바꾼 뒤 "새 버전"으로 배포했는지)'); }
      if(!data.ok) throw new Error(data.error || '서버에서 오류가 났어요.');
      return data.result;
    }catch(e){
      if(e.name === 'AbortError') throw new Error('응답이 너무 오래 걸려요. 잠시 후 다시 보내 주세요.');
      if(e instanceof TypeError) throw new Error('서버에 연결하지 못했어요. (선생님 확인: 웹앱 주소를 브라우저 시크릿 창에서 열어 "✅ 서버 작동 중"이 보이는지, 액세스 권한이 "모든 사용자"인지)');
      throw e;
    }finally{
      clearTimeout(timer);
    }
  }

  // 위키백과·위키미디어처럼 브라우저에서 바로 부를 수 있는 곳 (실패하면 null)
  async function getJson(url, timeoutMs){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 4000);
    try{
      const res = await fetch(url, { signal: ctrl.signal });
      return res.ok ? await res.json() : null;
    }catch(e){ return null; }
    finally{ clearTimeout(timer); }
  }
  function toQuery(params){
    return Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
  }

  /* ---------- 주제와 예시 질문 ---------- */
  const TOPICS = {
    all:     { label:'🧬 전체', name:'생명 기술', query:'생명 기술', wiki:'생명공학', photo:'biotechnology laboratory',
               desc:'생물의 특성과 기능을 이용해 인간에게 유용한 물질이나 생물을 만들어 내는 기술이에요.',
               examples:['생명 기술이 무엇인가요?','4가지 생명 기술의 차이를 알려주세요.','생명 기술 최신 뉴스를 찾아 주세요.'] },
    nuclear: { label:'🐑 핵 이식', name:'핵 이식 기술', query:'핵 이식 기술', wiki:'체세포 핵 이식', photo:'Dolly the sheep',
               desc:'핵을 없앤 난자에 다른 개체의 체세포 핵을 넣어, 유전적으로 같은 개체(복제 동물)를 만드는 기술이에요.',
               examples:['복제 양 돌리는 어떻게 만들어졌나요?','핵 이식 과정 영상을 찾아 주세요.','복제 양 돌리 사진을 보여 주세요.'] },
    gene:    { label:'🧪 유전자 재조합', name:'유전자 재조합 기술', query:'유전자 재조합 기술', wiki:'유전자 재조합', photo:'genetically modified crop',
               desc:'어떤 생물의 유용한 유전자를 잘라 내어 다른 생물의 DNA에 끼워 넣는 기술이에요.',
               examples:['대장균으로 인슐린을 어떻게 만드나요?','GMO 식품은 안전한가요?','GMO 관련 최신 뉴스를 찾아 주세요.'] },
    fusion:  { label:'🥔 세포 융합', name:'세포 융합 기술', query:'세포 융합 기술', wiki:'세포 융합', photo:'pomato',
               desc:'서로 다른 두 종류의 세포를 하나로 합쳐 두 세포의 특징을 함께 가진 세포를 만드는 기술이에요.',
               examples:['포마토는 어떻게 만들어졌나요?','세포 융합과 유전자 재조합은 뭐가 달라요?','세포 융합 자료를 찾아 주세요.'] },
    tissue:  { label:'🌱 조직 배양', name:'조직 배양 기술', query:'조직 배양 기술', wiki:'조직 배양', photo:'plant tissue culture',
               desc:'생물의 조직이나 세포 일부를 영양분이 든 배지에서 길러 새로운 개체나 조직을 얻는 기술이에요.',
               examples:['조직 배양으로 묘목을 대량으로 만드는 방법은?','조직 배양 영상을 찾아 주세요.','조직 배양 사진을 보여 주세요.'] },
    custom:  { label:'✏️ 직접 입력', name:'직접 입력',
               desc:'궁금한 생명 기술 주제를 직접 적어 보세요. (예: 줄기세포, 유전자 가위, 백신, 바이오 연료)',
               examples:[] }
  };

  /* ---------- ⚡ 교과서 바로 답 (예시 질문은 서버를 기다리지 않고 0초에) ---------- */
  const FAQ_LIST = [
    ['생명 기술이 무엇인가요?',
     '**생명 기술**은 생물의 특성과 기능을 이용해 사람에게 유용한 물질이나 생물을 만들어 내는 기술이에요. 식량, 의료, 환경, 에너지 분야에 널리 쓰여요. 예를 들어 대장균으로 당뇨병 치료에 쓰는 **인슐린**을 만들고, 조직 배양으로 병 없는 씨감자를 많이 길러 내요. 수업에서는 **핵 이식, 유전자 재조합, 세포 융합, 조직 배양** 네 가지를 배워요.\n\n🤔 생각해 보기: 내 주변에서 생명 기술로 만든 것은 무엇이 있을까요?'],
    ['4가지 생명 기술의 차이를 알려주세요.',
     '네 가지는 "무엇을 옮기거나 합치느냐"가 달라요.\n- **핵 이식**: 핵을 없앤 난자에 체세포의 핵을 넣어 **똑같은 개체**를 만들어요. (복제 양 돌리)\n- **유전자 재조합**: **필요한 유전자만** 잘라 다른 생물의 DNA에 끼워 넣어요. (인슐린을 만드는 대장균)\n- **세포 융합**: 서로 다른 두 **세포를 통째로** 합쳐요. (포마토)\n- **조직 배양**: 조직이나 세포 **일부를 배지에서 길러** 수를 늘려요. (씨감자, 난초)\n\n🤔 생각해 보기: 병에 강한 딸기 묘목을 많이 얻고 싶다면 어떤 기술이 알맞을까요?'],
    ['복제 양 돌리는 어떻게 만들어졌나요?',

      e.className = 'ex'; e.textContent = '💬 ' + q;
      e.onclick = () => send(q, true);
      ex.appendChild(e);
    });
  }

  /* ---------- 🔤 검색어 만들기 ---------- */
  function related(text, T){
    text = String(text || '');
    return BIO_TERMS.test(text) || !!(T.custom && text.replace(/\s/g, '').includes(T.custom.replace(/\s/g, '')));
  }
  function cleanQuery(text){
    return String(text || '')
      .replace(/유튜브|youtube|동영상|영상|비디오|사진|이미지|그림|자료|최신|최근|요즘|뉴스|기사|링크|출처|사이트|인터넷|웹/gi, ' ')
      .replace(/찾아\s*(줘|주세요|줄래|봐|봐요)?|보여\s*(줘|주세요|줄래)?|알려\s*(줘|주세요)?|검색해?\s*(줘|주세요)?|설명\S*/g, ' ')
      .replace(/못\s*찾\S*|왜|어떻게|무엇|뭐|뭔가요|인가요|있나요|없나요|거야|관련(된)?|있으면|좀|주세요|해\s*줘|에\s*대한|대한|있는/g, ' ')
      .replace(/(을|를|이랑|하고|에서)(?=\s|$)/g, ' ')
      .replace(/[?？!.~,"'()]/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  // "핵이식 기술 과정 찾아줘" → "핵이식 기술 과정" / 수업 낱말이 없으면 바로 앞 질문 → 없으면 주제
  function makeQuery(question, T, hist){
    let q = cleanQuery(question);
    if(!related(q, T)){
      for(let i = hist.length - 1; i >= 0; i--){
        const h = hist[i];
        if(h && h.role === 'user' && related(h.text, T)){ q = cleanQuery(h.text); break; }
      }
    }
    if(!related(q, T)) return T.query;
    const core = T.query.replace(/ 기술$/, '');
    if(T.key !== 'all' && !q.replace(/\s/g, '').includes(core.replace(/\s/g, ''))) q = core + ' ' + q;
    return q.slice(0, 60);
  }
  function detectIntent(text){
    const video = VIDEO_WORDS.test(text);
    const photo = PHOTO_WORDS.test(text) && (PHOTO_NAMED.test(text) || !video);
    const web = WEB_WORDS.test(text) && (WEB_NAMED.test(text) || (!video && !photo));
    return { web: web, video: video, photo: photo };
  }

  /* ---------- 화면 그리기 ---------- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function safeUrl(u){ u = String(u || ''); return /^https:\/\//.test(u) ? esc(u) : ''; }
  function link(url, inner, cls){
    return '<a class="' + cls + '" href="' + safeUrl(url) + '" target="_blank" rel="noopener">' + inner + '</a>';
  }

  function formatAnswer(text){
    let html = '', inList = false;
    esc(text).split('\n').forEach(line => {
      const m = line.match(/^\s*[-*•]\s+(.*)/);
      if(m){
        if(!inList){ html += '<ul>'; inList = true; }
        html += '<li>' + m[1] + '</li>';
      } else {
        if(inList){ html += '</ul>'; inList = false; }
        html += line.trim() ? line + '<br>' : '<br>';
      }
    });
    if(inList) html += '</ul>';
    return html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(<br>)+$/, '');
  }

  function addUserMsg(text){
    const d = document.createElement('div');
    d.className = 'msg user';
    d.innerHTML = '<span class="tag">' + esc(topicLabel()) + '</span>' + esc(text).replace(/\n/g, '<br>');
    chat.appendChild(d); scrollDown();
  }
  // 도우미 말풍선: 답(ans) · 자료(src) · 영상(vid) · 사진(img) · 포털(portal) · 걸린 시간(meta) 칸을 미리 만들어 둠
  function addBotMsg(text, opts){
    opts = opts || {};
    const d = document.createElement('div');
    d.className = 'msg bot' + (opts.error ? ' error' : '');
    d.innerHTML = '<div class="ans"></div><div class="src-slot"></div><div class="vid-slot"></div><div class="img-slot"></div><div class="portal-slot"></div><div class="meta"></div>';
    const m = { el: d };
    ['ans', 'src-slot', 'vid-slot', 'img-slot', 'portal-slot', 'meta'].forEach(c => { m[c.replace('-slot', '')] = d.querySelector('.' + c); });
    if(text != null) m.ans.innerHTML = formatAnswer(text);
    else m.ans.innerHTML = '<div class="typing"><span></span><span></span><span></span><em>' + esc(opts.typing || '답을 쓰고 있어요…') + '</em></div>';
    chat.appendChild(d); scrollDown();
    return m;
  }
  function setBusy(v){ busy = v; sendBtn.disabled = v; sendBtn.textContent = v ? '생각 중…' : '보내기'; }

  /* ---------- 🔎 포털에서 더 찾아보기 (바로 만들어지는 링크) ---------- */
  function renderPortal(m, query){
    const q = encodeURIComponent(query);
    const sites = [
      ['네이버', 'https://search.naver.com/search.naver?query=' + q],
      ['다음', 'https://search.daum.net/search?q=' + q],
      ['구글', 'https://www.google.com/search?q=' + q],
      ['🖼 이미지', 'https://search.naver.com/search.naver?where=image&query=' + q],
      ['▶ 유튜브', 'https://www.youtube.com/results?search_query=' + q]
    ];
    m.portal.innerHTML = '<div class="box"><b>🔎 포털에서 더 찾아보기 · ' + esc(query) + '</b><div class="portal">' +
      sites.map(s => link(s[1], esc(s[0]), '')).join('') + '</div></div>';
  }

  /* ---------- 📚 위키백과 (브라우저가 직접) + 뉴스 (서버가 답과 함께) ---------- */
  function readWiki(data){
    const pages = data && data.query && data.query.pages;
    if(!pages) return [];
    return Object.values(pages).sort((a, b) => (a.index || 0) - (b.index || 0))
      .filter(p => p.fullurl && p.title)
      .map(p => ({ kind:'백과', title:p.title, url:p.fullurl, site:'위키백과', date:'',
                   summary:String(p.extract || '').replace(/\s+/g, ' ').slice(0, 300) }));
  }
  function wikiUrl(query){
    return 'https://ko.wikipedia.org/w/api.php?' + toQuery({
      action:'query', format:'json', origin:'*', redirects:'1',
      generator:'search', gsrsearch:query, gsrlimit:'3', gsrnamespace:'0',
      prop:'extracts|info', exintro:'1', explaintext:'1', exchars:'350', exlimit:'3', inprop:'url'
    });
  }
  async function wikiSearch(question, query, T){
    const term = pick(WIKI_TERMS, question + ' ' + query, T.wiki);
    const jobs = [getJson(wikiUrl(query), 3000)];
    if(term !== query) jobs.push(getJson(wikiUrl(term), 3000));
    const res = await Promise.all(jobs);
    return uniqueByUrl(readWiki(res[0]).concat(readWiki(res[1]))).slice(0, 2);
  }
  function uniqueByUrl(list){
    const seen = {};
    return list.filter(x => { if(!x || !x.url || seen[x.url]) return false; seen[x.url] = true; return true; });
  }
  function renderSources(m, sources, waitingNews){
    const items = (sources || []).filter(s => safeUrl(s.url));
    if(!items.length && !waitingNews){ m.src.innerHTML = ''; return; }
    let html = '<div class="box"><b>📚 인터넷에서 찾은 자료</b>';
    items.forEach(s => {
      const icon = s.kind === '뉴스' ? '📰 ' : '📖 ';
      const sub = [s.site, s.date].filter(Boolean).join(' · ');
      html += link(s.url, icon + esc(s.title) + (sub ? '<small>' + esc(sub) + '</small>' : ''), 'src');
    });
    if(waitingNews) html += '<div class="nofound">📰 뉴스를 찾고 있어요…</div>';
    m.src.innerHTML = html + '</div>';
    scrollDown();
  }

  /* ---------- ▶️ 영상 ---------- */
  function makeVideo(id, title, channel, teacher){
    return { id:id, title:title, channel:channel || '', teacher:!!teacher, trusted:true,
             thumb:'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg', url:'https://www.youtube.com/watch?v=' + id };
  }
  // ⚡ 서버를 기다리지 않고 바로 고르는 영상: ① 선생님 추천(영상목록 시트) → ② 내장 목록
  function localVideos(query, T){
    const qn = query.replace(/\s/g, '').toLowerCase();
    const teacher = (serverInfo.teacherVideos || [])
      .filter(v => (v.keys || []).some(k => k && (qn.includes(k) || k.includes(qn))))
      .map(v => makeVideo(v.id, v.title, v.channel, true));

    // 탭 이름에서 붙은 말(예: '유전자 재조합')을 뺀 나머지(예: 'GMO')에 맞는 영상을 먼저
    const specific = query.replace(/생명\s*기술|핵\s*이식(\s*기술)?|유전자\s*재조합|세포\s*융합|조직\s*배양|기술/g, ' ').trim();
    let hit = VIDEOS.filter(r => r[0].test(query));
    if(specific){
      const first = hit.filter(r => r[0].test(specific));
      hit = first.concat(hit.filter(r => !first.includes(r)));
    }
    // 모자라면 같은 주제(탭 또는 맞은 영상의 주제)의 영상으로 채우기
    const keys = [];
    if(T.key !== 'all' && T.key !== 'custom') keys.push(T.key);
    hit.forEach(r => { if(!keys.includes(r[1])) keys.push(r[1]); });
    keys.forEach(tk => VIDEOS.forEach(r => { if(hit.length < VIDEO_MAX + 2 && r[1] === tk && !hit.includes(r)) hit.push(r); }));

    return uniqueByUrl(teacher.concat(hit.map(r => makeVideo(r[2], r[3], r[4], false)))).slice(0, VIDEO_MAX + 2);
  }
  // 썸네일이 진짜로 열리는 영상만 남기기 (지워진 영상 숨기기) — 길어도 1.5초
  function aliveVideos(list){
    return new Promise(resolve => {
      if(!list.length){ resolve([]); return; }
      const state = list.map(() => null);
      let left = list.length, done = false;
      const finish = () => {
        if(done) return; done = true;
        // 아직 확인이 안 끝난 영상은 확실한 영상(trusted)만 보여 줌
        resolve(list.filter((v, i) => state[i] === true || (state[i] === null && v.trusted)));
      };
      list.forEach((v, i) => {
        const img = new Image();
        img.onload = () => { state[i] = img.naturalWidth > 120; if(--left <= 0) finish(); };
        img.onerror = () => { state[i] = false; if(--left <= 0) finish(); };
        img.src = v.thumb;
      });
      setTimeout(finish, 1500);
    });
  }
  function embedUrl(id, autoplay){
    return 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
      '?rel=0&modestbranding=1&playsinline=1' + (autoplay ? '&autoplay=1' : '');
  }
  function nowPlayingHtml(v){
    return esc(v.title) + (v.teacher ? '<span class="pick">선생님 추천</span>' : '') +
      (v.channel ? ' <small>· ' + esc(v.channel) + '</small>' : '') +
      link(v.url, '유튜브에서 보기 ↗', '');
  }
  function videoBox(m, more){
    m.vid.innerHTML = '<div class="box"><b>▶️ 찾은 영상</b><div class="vplayer"></div><div class="vthumbs-wrap"></div>' +
      '<div class="nofound vstatus">🔎 영상을 찾고 있어요…</div>' +
      '<div>' + link(more, '🔍 유튜브에서 더 찾아보기', 'ytmore') + '</div></div>';
    const box = m.vid.firstChild;
    box._list = []; box._cur = 0;
    scrollDown();
    return box;
  }
  // 첫 영상은 플레이어로 바로, 나머지는 썸네일 → 누르면 플레이어에서 재생
  // (영상이 뒤늦게 더 와도 재생 중인 플레이어는 건드리지 않고 썸네일만 다시 그림)
  function showVideos(m, box, list){
    box._list = list;
    const player = box.querySelector('.vplayer');
    if(list.length && !player.firstChild){
      const first = list[0];
      player.innerHTML = '<div class="player"><iframe src="' + embedUrl(first.id, false) + '" title="' + esc(first.title) + '"' +
        ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"' +
        ' referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>' +
        '<div class="nowplaying">' + nowPlayingHtml(first) + '</div>';
      m.el.classList.add('has-video');
    }
    const wrap = box.querySelector('.vthumbs-wrap');
    wrap.innerHTML = list.length > 1 ? '<div class="vthumbs">' + list.map((v, i) =>
      '<button type="button" class="vthumb' + (i === box._cur ? ' on' : '') + '" data-i="' + i + '">' +
      '<img src="' + safeUrl(v.thumb) + '" alt=""><span>' + (i === box._cur ? '▶ ' : '') + esc(v.title) + '</span></button>'
    ).join('') + '</div>' : '';
    wrap.querySelectorAll('.vthumb').forEach(btn => {
      btn.onclick = () => {
        box._cur = Number(btn.dataset.i);
        const v = box._list[box._cur];
        box.querySelector('.player iframe').src = embedUrl(v.id, true);
        box.querySelector('.nowplaying').innerHTML = nowPlayingHtml(v);
        showVideos(m, box, box._list);
      };
    });
    scrollDown();
  }
  function videoStatus(box, text, isCredit){
    const s = box.querySelector('.vstatus');
    s.className = (isCredit ? 'credit' : 'nofound') + ' vstatus';
    s.textContent = text;
  }
  async function runVideos(m, query, T, found){
    const more = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
    const box = videoBox(m, more);
    const PLAY_TIP = '▶ 버튼을 누르면 여기서 바로 재생돼요. 재생이 안 되는 영상은 "유튜브에서 보기"를 눌러 주세요.';

    // ① 화면이 가진 영상: 바로
    let list = (await aliveVideos(localVideos(query, T))).slice(0, VIDEO_MAX);
    if(list.length){ showVideos(m, box, list); videoStatus(box, PLAY_TIP, true); }
    found.video = list;

    // ② 모자랄 때만 서버에 더 물어봄 (유튜브 API 키가 있거나, 하나도 못 찾았을 때)
    const needMore = serverInfo.moreVideos !== false && (list.length === 0 || (list.length < VIDEO_MAX && serverInfo.yt));
    if(needMore){
      if(!list.length) videoStatus(box, '🔎 유튜브에서 영상을 찾고 있어요… (조금 걸려요)');
      try{
        const r = await api('videos', { query: query, topic: T.key }, 30000);
        const fresh = ((r && r.videos) || []).filter(v => v && v.id && safeUrl(v.url) && safeUrl(v.thumb) && !list.some(x => x.id === v.id));
        list = list.concat(await aliveVideos(fresh)).slice(0, VIDEO_MAX);
        if(list.length){ showVideos(m, box, list); videoStatus(box, PLAY_TIP, true); }
        found.video = list;
      }catch(e){}
    }
    if(!list.length) videoStatus(box, '알맞은 영상을 바로 찾지 못했어요. 아래 버튼으로 유튜브에서 직접 찾아보세요.');
  }

  /* ---------- 📷 사진 (위키미디어 공용 — 브라우저가 직접) ---------- */
  function readCommons(data){
    const pages = data && data.query && data.query.pages;
    if(!pages) return [];
    const strip = s => String((s && s.value) || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    return Object.values(pages).sort((a, b) => (a.index || 0) - (b.index || 0))
      .filter(p => { const ii = p.imageinfo && p.imageinfo[0]; return ii && ii.thumburl && /image\/(jpeg|png)/.test(ii.mime || ''); })
      .slice(0, 4)
      .map(p => {
        const ii = p.imageinfo[0], meta = ii.extmetadata || {};
        return {
          thumb: ii.thumburl, page: ii.descriptionurl,
          title: String(p.title || '').replace(/^File:/, '').replace(/\.[a-z0-9]+$/i, '').replace(/_/g, ' ').slice(0, 60),
          author: strip(meta.Artist).slice(0, 40), license: strip(meta.LicenseShortName).slice(0, 30)
        };
      });
  }
  function commonsSearch(keyword){
    return getJson('https://commons.wikimedia.org/w/api.php?' + toQuery({
      action:'query', format:'json', origin:'*',
      generator:'search', gsrsearch:keyword + ' filetype:bitmap', gsrnamespace:'6', gsrlimit:'12',
      prop:'imageinfo', iiprop:'url|mime|extmetadata', iiurlwidth:'480'
    }), 5000).then(readCommons);
  }
  // 한글 낱말의 영어 이름 (위키백과의 다른 언어 연결) — 직접 입력 주제용
  async function englishName(word){
    const data = await getJson('https://ko.wikipedia.org/w/api.php?' + toQuery({
      action:'query', format:'json', origin:'*', redirects:'1', titles:word, prop:'langlinks', lllang:'en', lllimit:'1'
    }), 2500);
    const pages = data && data.query && data.query.pages;
    const p = pages && Object.values(pages)[0];
    return (p && p.langlinks && p.langlinks[0] && p.langlinks[0]['*']) || '';
  }
  async function runPhotos(m, question, query, T, found){
    m.img.innerHTML = '<div class="box"><b>📷 사진</b><div class="nofound">🔎 사진을 찾고 있어요…</div></div>';
    scrollDown();
    let kw = pick(PHOTO_TERMS, question + ' ' + T.custom, '');
    if(!kw && T.custom) kw = await englishName(T.custom);
    const fallback = T.photo || 'biotechnology laboratory';
    if(!kw) kw = fallback;
    found.photoQuery = kw;

    let images = await commonsSearch(kw);
    if(!images.length && kw !== fallback){ found.photoQuery = fallback; images = await commonsSearch(fallback); }
    images = images.filter(im => safeUrl(im.thumb) && safeUrl(im.page));
    found.photo = images;

    if(!images.length){
      m.img.innerHTML = '<div class="box"><b>📷 사진</b><div class="nofound">알맞은 사진을 바로 찾지 못했어요. 아래 "🖼 이미지"를 눌러 찾아보세요.</div></div>';
      return;
    }
    let html = '<div class="box"><b>📷 사진</b><div class="gallery">';
    images.forEach(im => {
      const by = [im.author, im.license].filter(Boolean).join(' · ');
      html += '<figure>' + link(im.page,
        '<img src="' + safeUrl(im.thumb) + '" alt="' + esc(im.title) + '">' +
        '<figcaption>' + esc(im.title) + (by ? '<small>' + esc(by) + '</small>' : '') + '</figcaption>', '') + '</figure>';
    });
    m.img.innerHTML = html + '</div><div class="credit">사진 출처: 위키미디어 공용 · 누르면 원본과 저작권 정보를 볼 수 있어요.</div></div>';
    m.img.querySelectorAll('img').forEach(img => img.addEventListener('load', scrollDown));
    scrollDown();
  }

  /* ---------- 보내기 ---------- */
  async function send(text, isExample){
    text = (text || qBox.value).trim();
    if(!text || busy) return;
    if(text === '/점검'){ qBox.value = ''; selfTest(); return; }   // 🧑‍🏫 선생님용 속도 점검
    if(!userName){ openModal(); return; }
    if(topic === 'custom' && !customTopic){
      addBotMsg('✏️ 먼저 위 입력란에 **주제**를 적고 [정하기]를 눌러 주세요.', { error:true });
      const box = $('customInput'); if(box) box.focus();
      return;
    }
    const T = topicInfo(), sentTopic = topic, sentName = userName, sentCustom = T.custom;
    const sentHistory = history.slice();
    addUserMsg(text);
    qBox.value = '';
    setBusy(true);

    const started = performance.now();
    const want = detectIntent(text);
    const query = makeQuery(text, T, sentHistory);
    const found = { web: [], video: [], photo: [], photoQuery: '' };

    // ⚡ 말풍선을 먼저 만들고, 준비되는 것부터 차례로 채움 (영상·사진·자료는 답을 기다리지 않음)
    const m = addBotMsg(null);
    const jobs = [];
    if(want.video) jobs.push(runVideos(m, query, T, found).catch(() => {}));
    if(want.photo) jobs.push(runPhotos(m, text, query, T, found).catch(() => {}));
    renderPortal(m, query);

    let wiki = null;
    if(want.web){
      renderSources(m, [], true);
      wiki = await wikiSearch(text, query, T).catch(() => []);
      found.web = wiki;
      renderSources(m, wiki, true);
    }

    // 💬 답: 교과서 바로 답(FAQ)이 있으면 0초, 없으면 서버(AI)
    let res;
    const faq = sentTopic !== 'custom' ? FAQ[norm(text)] : null;
    if(faq){
      res = { ok: true, answer: faq, instant: true };
    } else {
      try{
        const args = { name: sentName, topic: sentTopic, question: text, history: sentHistory, isExample: !!isExample, custom: sentCustom, query: query };
        if(wiki) args.wiki = wiki.map(w => ({ title: w.title, summary: w.summary, url: w.url }));
        res = (await api('ask', args)) || { ok: false, answer: '답을 받지 못했어요. 다시 보내 주세요.' };
      }catch(err){
        res = { ok: false, answer: '연결에 문제가 생겼어요. 잠시 후 다시 보내 주세요.\n(' + (err && err.message ? err.message : err) + ')' };
      }
    }

    const sec = ((performance.now() - started) / 1000).toFixed(1);
    m.ans.innerHTML = formatAnswer(res.answer);
    if(!res.ok) m.el.classList.add('error');
    m.meta.textContent = res.ok ? '⚡ ' + sec + '초' + (res.instant ? ' · 교과서 바로 답' : res.cached ? ' · 저장된 답' : '') : '';
    if(want.web || (res.sources && res.sources.length)){
      found.web = uniqueByUrl((found.web || []).concat(res.sources || []));
      renderSources(m, found.web, false);
    }
    setBusy(false);
    scrollDown();
    qBox.focus();

    if(res.ok){
      history.push({ role:'user', text:text }, { role:'model', text:res.answer });
      history = history.slice(-4);
    }

    // 🗂 기록 저장 (화면은 이미 끝났고, 영상·사진까지 다 찾은 뒤 뒤에서 저장 → 학생은 기다리지 않음)
    await Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 12000))]);
    const list = []
      .concat((found.web || []).map(s => ({ type:'웹', title:s.title, url:s.url })))
      .concat((found.video || []).map(v => ({ type:'영상', title:v.title, url:v.url })))
      .concat((found.photo || []).map(im => ({ type:'사진', title:im.title, url:im.page })));
    api('log', { name: sentName, topic: sentTopic, question: text, answer: res.answer, ok: res.ok, found: list,
                 query: { web: want.web ? query : '', video: want.video ? query : '', photo: found.photoQuery },
                 seconds: sec, custom: sentCustom }).catch(() => {});
  }

  /* ---------- 🧑‍🏫 속도 점검: 입력창에 /점검 을 보내면 실제 주소로 각 기능이 되는지와 걸린 시간을 보여 줌 ---------- */
  async function selfTest(){
    setBusy(true);
    const m = addBotMsg(null, { typing: '실제 서버로 점검하고 있어요… (10초쯤 걸려요)' });
    const lines = ['**🧑‍🏫 속도 점검** (화면 ' + PAGE_VERSION + ')'];
    const run = async (label, fn) => {
      const t = performance.now();
      let note;
      try{ note = await fn(); }catch(e){ note = '❌ ' + (e && e.message ? e.message : e); }
      lines.push('- ' + label + ': ' + ((performance.now() - t) / 1000).toFixed(1) + '초 · ' + note);
    };
    await run('서버 연결', async () => { const v = await api('warmup', {}, 30000); return '✅ 서버 ' + ((v && v.version) || v) + ' · 선생님 추천 영상 ' + ((v && v.teacherVideos) || []).length + '개'; });
    await run('위키백과 (브라우저 직접)', async () => { const n = readWiki(await getJson(wikiUrl('조직 배양'), 5000)).length; return n ? '✅ ' + n + '개' : '❌ 못 찾음'; });
    await run('사진 (브라우저 직접)', async () => { const n = (await commonsSearch('Dolly the sheep')).length; return n ? '✅ ' + n + '장' : '❌ 못 찾음'; });
    await run('내장 영상 ' + VIDEOS.length + '개 확인', async () => {
      const all = VIDEOS.map(r => makeVideo(r[2], r[3], r[4], false));
      all.forEach(v => { v.trusted = false; });
      const ok = await aliveVideos(all);
      const dead = all.filter(v => !ok.includes(v)).map(v => v.id);
      return dead.length ? '⚠️ 안 열리는 영상 ' + dead.length + '개: ' + dead.join(', ') : '✅ 모두 열림';
    });
    await run('AI 답변 (새 질문)', async () => { const r = await api('ask', { name: '점검', topic: 'all', question: '무추의 특징을 알려 주세요 ' + Date.now() % 1000 + '번', history: [] }); return r.ok ? '✅' + (r.cached ? ' (저장된 답)' : '') : '❌ ' + r.answer; });
    await run('AI 답변 + 뉴스', async () => { const r = await api('ask', { name: '점검', topic: 'gene', question: 'GMO 관련 최신 뉴스를 찾아 주세요.', history: [], query: 'GMO', wiki: [] }); return r.ok ? '✅ 뉴스 ' + (r.sources || []).length + '개' + (r.cached ? ' (저장된 답)' : '') : '❌ ' + r.answer; });
    lines.push('', '이 내용을 그대로 복사해 Claude에게 보여 주면 어디가 느린지 바로 알 수 있어요.');
    m.ans.innerHTML = formatAnswer(lines.join('\n'));
    setBusy(false); scrollDown();
  }

  sendBtn.onclick = () => send();
  qBox.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });

  /* ---------- 시작 ---------- */
  try{ customTopic = sessionStorage.getItem('lifeTechCustom') || ''; }catch(e){}
  renderTopics();
  addBotMsg('안녕하세요! 저는 **생명 기술 도우미**예요. 🌱\n위에서 주제를 고르고 궁금한 점을 물어보세요.\n**✏️ 직접 입력**을 누르면 궁금한 주제를 직접 정할 수 있어요.\n- **"자료 찾아 줘"** → 위키백과·뉴스 자료\n- **"영상 찾아 줘"** → 유튜브 영상\n- **"사진 보여 줘"** → 사진\n예시 질문을 눌러도 바로 답해 드려요!');
  try{ userName = sessionStorage.getItem('lifeTechName') || ''; }catch(e){}
  if(userName){ $('whoami').textContent = userName; $('modal').classList.add('hidden'); }
  else { openModal(); }

  // 서버를 미리 깨우고, 버전과 선생님 추천 영상 목록을 받아 둠
  function warmup(first){
    return api('warmup', {}, 30000).then(v => {
      const info = (v && typeof v === 'object') ? v : { version: String(v || '') };   // 예전 서버는 버전 글자만 보냄
      serverInfo = Object.assign({ teacherVideos: [], yt: false, moreVideos: true }, info);
      $('ver').textContent = serverInfo.version === PAGE_VERSION
        ? '· ' + PAGE_VERSION
        : '· 화면 ' + PAGE_VERSION + ' / 서버 ' + (serverInfo.version || '?') + ' ⚠️';
      if(first && serverInfo.version !== PAGE_VERSION){
        addBotMsg('⚠️ 선생님 확인: 서버(Code.gs)가 ' + (serverInfo.version || '예전 버전') + '이에요. Code.gs를 ' + PAGE_VERSION + '로 바꾸고 **새 버전으로 배포**하면 더 빨라져요.', { error:true });
      }
    });
  }
  warmup(true).catch(err => {
    $('ver').textContent = '· 서버 연결 안 됨';
    addBotMsg('⚠️ 서버에 연결되지 않았어요.\n(' + err.message + ')', { error:true });
  });
  // ⚡ 화면이 열려 있는 동안 4분마다 서버를 살짝 깨워 둠
  setInterval(() => {
    if(document.visibilityState === 'visible' && !busy) warmup(false).catch(() => {});
  }, 240000);
</script>
</body>
</html>
